美国筛选 = NameRegex, FilterKey = "(?i)^(?!.*(家宽|住宅|家庭宽带|Residential))(🇺🇸|LAX|SFO|SJC|SEA|ORD|DFW|JFK|EWR|IAD|MIA|ATL|美国|美國|洛杉矶|洛杉磯|纽约|紐約|硅谷|矽谷|圣何塞|聖何塞|西雅图|芝加哥|达拉斯|達拉斯|迈阿密|United\s?States|America|Los\s?Angeles|New\s?York|San\s?Jose|Seattle|Chicago|Dallas|(^|[^A-Z])US([^A-Z]|$))"
