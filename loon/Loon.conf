俄罗斯筛选 = NameRegex, FilterKey = "(?i)^(?!.*(家宽|住宅|家庭宽带|Residential))(🇷🇺|SVO|俄罗斯|俄羅斯|莫斯科|Russia|Moscow|(^|[^A-Z])RU([^A-Z]|$))"
