印尼筛选 = NameRegex, FilterKey = "(?i)^(?!.*(家宽|住宅|家庭宽带|Residential))(🇮🇩|CGK|印尼|印度尼西亚|雅加达|Indonesia|Jakarta|(^|[^A-Z])ID([^A-Z]|$))"
