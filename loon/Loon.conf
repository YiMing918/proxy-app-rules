家宽筛选 = NameRegex, FilterKey = "(?i)(家宽|住宅|家庭宽带|Residential)"
低倍率筛选 = NameRegex, FilterKey = "(?i)^(?!.*(家宽|住宅|家庭宽带|Residential))(0\.\d+\s*(x|×|倍)|倍率\s*0\.\d+)"
高倍率筛选 = NameRegex, FilterKey = "(?i)^(?!.*(家宽|住宅|家庭宽带|Residential))(([2-9]|[1-9]\d+)(\.\d+)?\s*(x|×|倍)|倍率\s*([2-9]|[1-9]\d+))"
优选IP筛选 = NameRegex, FilterKey = "(?i)^(?!.*(家宽|住宅|家庭宽带|Residential))(优选IP)"

