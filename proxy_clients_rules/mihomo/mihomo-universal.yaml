# ============================================================
# mihomo 家族通用分流配置（由 FlClash 覆写脚本 v3.4 移植）
# 分组默认值、地区识别、规则顺序、DNS、测速节奏与 v3.4 完全一致：
# 测速组 interval=600 秒 + lazy 懒测（省额度设计，不许改小）；容差 50ms。
# 两条硬规矩：①每个用途组默认走「·顺位」兜底链，第一顺位地区没节点自动往下顺，
#   但分组仍是手动可选组，随时能改选任何地区/节点；②家宽节点只进「🏠 家宽节点」手动组，
#   所有自动组都剔除家宽（此条按站长新规矩，与 v3.4 原稿的家宽处理不同）。
# 用法：把下面 proxy-providers 里的订阅链接换成你自己的，其余不用动。
# 适用于：Clash Verge Rev / Mihomo Party / ClashMeta / Stash / OpenClash
# （各 APP 的导入方式与小差别见本文件夹 README.md）
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# ---------- 订阅：把 url 换成你自己的订阅链接 ----------
proxy-providers:
  sub:
    type: http
    url: "https://example.com/把这里换成你的订阅链接"
    interval: 86400
    path: ./providers/sub.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

# ---------- 去广告规则集（ACL4SSR 每日更新 + 秋风去广告） ----------
rule-providers:
  UnBan:
    {type: http, behavior: classical, format: text, interval: 86400, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list", path: ./ruleset/UnBan.list}
  BanAD:
    {type: http, behavior: classical, format: text, interval: 86400, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list", path: ./ruleset/BanAD.list}
  BanProgramAD:
    {type: http, behavior: classical, format: text, interval: 86400, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list", path: ./ruleset/BanProgramAD.list}
  BanEasyList:
    {type: http, behavior: classical, format: text, interval: 86400, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list", path: ./ruleset/BanEasyList.list}
  AWAvenue:
    {type: http, behavior: classical, format: yaml, interval: 86400, url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml", path: ./ruleset/AWAvenue.yaml}

proxy-groups:
  - {name: "🚀 节点选择", type: select, proxies: ["♻️ 自动选择", "🛡️ 故障转移", "⚖️ 负载均衡", "🇭🇰 香港", "🇹🇼 台湾", "🇯🇵 日本", "🇰🇷 韩国", "🇸🇬 新加坡", "🇲🇾 马来西亚", "🇹🇭 泰国", "🇻🇳 越南", "🇮🇩 印尼", "🇵🇭 菲律宾", "🇮🇳 印度", "🇦🇺 澳大利亚", "🇺🇸 美国", "🇨🇦 加拿大", "🇬🇧 英国", "🇩🇪 德国", "🇫🇷 法国", "🇳🇱 荷兰", "🇷🇺 俄罗斯", "🇹🇷 土耳其", "🇧🇷 巴西", "🌍 其他", "🏠 家宽节点", "💰 低倍率", "💎 高倍率", "⭐ 优选IP", "👋 手动选择", "DIRECT"]}
  - {name: "♻️ 自动选择", type: url-test, use: [sub], url: https://cp.cloudflare.com/generate_204, interval: 600, tolerance: 50, lazy: true, timeout: 3000, max-failed-times: 3, exclude-filter: "(?i)(剩余流量|流量剩余|距离下次重置|到期|过期|官网|请更新订阅|更新订阅|家宽|住宅|家庭宽带|Residential)"}
  - {name: "🛡️ 故障转移", type: fallback, use: [sub], url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true, timeout: 3000, max-failed-times: 3, exclude-filter: "(?i)(剩余流量|流量剩余|距离下次重置|到期|过期|官网|请更新订阅|更新订阅|家宽|住宅|家庭宽带|Residential)"}
  - {name: "⚖️ 负载均衡", type: load-balance, strategy: consistent-hashing, use: [sub], url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true, timeout: 3000, exclude-filter: "(?i)(剩余流量|流量剩余|距离下次重置|到期|过期|官网|请更新订阅|更新订阅|家宽|住宅|家庭宽带|Residential)"}
